[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 700
via_ir = true
evm_version = "cancun"
# The default per-test gas limit is 2^30. `test/markout/MarkoutReplay.t.sol` replays 1,185 real price
# rounds through four legs and does it once per cell of a five-point vol sweep and an eight-window sweep,
# which is a few billion gas of `Phi` evaluation in a single test. Nothing here is gas-metered for
# correctness -- `test/invariants/GasReport.t.sol` measures gas with `gasleft()` deltas, which this does
# not touch -- and no test reads `block.gaslimit`.
gas_limit = 40_000_000_000
block_gas_limit = 40_000_000_000
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./test/encoding" },
    { access = "read-write", path = "./test/markout" },
    { access = "read", path = "../scripts/arb/series" },
]

[fmt]
single_line_statement_blocks = "multi"
multiline_func_header = "all"
bracket_spacing = true
int_types = "long"
number_underscore = "thousands"
