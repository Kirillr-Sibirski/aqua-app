# The volatility surface, reconstructed from Aqua's own event log.
#
# Aqua takes a strategy "fully instead of being pre-hashed, for data availability", so the `Shipped`
# event carries the whole program. A Strikeline leg encodes its strike, its implied vol, its maturity
# and its liquidity in the clear inside that program, which makes every option ever written on the
# router publicly readable. This schema is what those bytes become once decoded.

"A wallet that has written options on the router."
type Maker @entity(immutable: false) {
  "The maker's address, lowercase hex."
  id: ID!
  legs: [Leg!]! @derivedFrom(field: "maker")
  fills: [Fill!]! @derivedFrom(field: "maker")
  "Legs ever shipped, docked ones included."
  legsShipped: Int!
  "Legs currently active in Aqua."
  legsLive: Int!
  fillCount: Int!
  firstSeenAt: BigInt!
  lastSeenAt: BigInt!
}

"""
One option, as written. The `id` is the Aqua strategy hash, which is `keccak256` of the shipped
bytes and therefore also `SwapVM.hash(order)` — the same identity the router, the registry and the
lens all use.
"""
type Leg @entity(immutable: false) {
  id: ID!
  maker: Maker!
  "The app the strategy was shipped to: our router."
  app: Bytes!

  "Lower of the two token addresses, as MakerTraits orders them."
  tokenA: Bytes!
  tokenB: Bytes!
  "The token the curve treats as risky: the underlying being sold upside on."
  tokenRisky: Bytes!
  tokenStable: Bytes!
  riskyIsTokenA: Boolean!

  "Strike, 1e18, normalised stable per risky."
  strikeWad: BigInt!
  """
  The maker's implied vol, annualised, 1e18. This is the surface's z axis, and it is a parameter of
  the quote rather than something solved for: the curve's shape is literally sigma.
  """
  sigmaWad: BigInt!
  "Expiry, unix seconds."
  maturity: BigInt!
  "Fixed liquidity L, 1e18, in risky units. The notional the leg writes."
  liquidityWad: BigInt!
  "Raw-to-normalised multiplier for the risky token, so an 18/6 decimal pair prices in one space."
  rateRisky: BigInt!
  rateStable: BigInt!
  "Bit 0 riskyIsTokenA, bit 1 postExpiryOneWay, bit 2 postExpiryOutIsRisky."
  flags: Int!
  """
  True when the program also carries the Coverage wrapper, i.e. the quoted depth is margined against
  the maker's real wallet inside the same call that prices the trade.
  """
  guarded: Boolean!

  "abi.encode(order), verbatim from the Shipped event, so nothing above has to be taken on trust."
  strategy: Bytes!
  "The SwapVM program slice of order.data."
  program: Bytes!

  "Aqua's virtual reserve, raw token units, walked forward by Pushed and Pulled."
  reserveRisky: BigInt!
  reserveStable: BigInt!
  docked: Boolean!
  dockedAt: BigInt
  dockedTx: Bytes

  shippedAt: BigInt!
  shippedAtBlock: BigInt!
  shippedTx: Bytes!

  fills: [Fill!]! @derivedFrom(field: "leg")
  fillCount: Int!
  "Cumulative raw amounts that have moved through this leg."
  volumeIn: BigInt!
  volumeOut: BigInt!

  "The (strike, expiry) cell of the surface this leg sits in."
  point: SurfacePoint!
}

"A single swap against a leg, from the router's own Swapped event."
type Fill @entity(immutable: true) {
  "transactionHash-logIndex"
  id: ID!
  leg: Leg!
  maker: Maker!
  taker: Bytes!
  tokenIn: Bytes!
  tokenOut: Bytes!
  amountIn: BigInt!
  amountOut: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"""
One cell of the surface: every leg any maker has written on this pair, at this strike and expiry.

This is the quote Aqua structurally lacks. The registry has no order book — a strategy is opaque
bytes keyed by its own hash, and nothing aggregates two makers who happen to have written the same
option. Decoding the log builds that book.
"""
type SurfacePoint @entity(immutable: false) {
  "tokenRisky-tokenStable-strikeWad-maturity. The pair is in the key because strikeWad is normalised."
  id: ID!
  strikeWad: BigInt!
  maturity: BigInt!
  tokenRisky: Bytes!
  tokenStable: Bytes!

  legs: [Leg!]! @derivedFrom(field: "point")
  "Explicit membership, so a dock can recompute the cell without a derived-field load."
  legIds: [String!]!
  legCount: Int!
  liveLegCount: Int!

  """
  Widest implied vol quoted at this point by a live leg. This is the best bid: the maker paying the
  most theta to whoever takes the other side of the option.
  """
  maxSigmaWad: BigInt!
  "Tightest implied vol quoted at this point by a live leg."
  minSigmaWad: BigInt!
  "The live leg quoting maxSigmaWad."
  bestLeg: Leg
  "Sum of L over live legs: the notional written at this point across all makers."
  liveLiquidityWad: BigInt!

  updatedAt: BigInt!
}
