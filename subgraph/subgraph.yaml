specVersion: 1.0.0
description: >-
  Strikeline Surface — an implied-volatility surface reconstructed from 1inch Aqua's own event log.
  Aqua publishes the whole strategy for data availability, and a Strikeline leg encodes its strike,
  implied vol, maturity and liquidity in the clear inside the program bytes, so every option written
  on the router is decodable by anyone with the log.
repository: https://github.com/strikeline/strikeline
schema:
  file: ./schema.graphql

dataSources:
  # ---------------------------------------------------------------------------------------------
  # The OFFICIAL Aqua registry. Never redeployed, never modified. Its events have no indexed
  # parameters, so the app filter has to happen in the mapping; `context.router` is that filter.
  # ---------------------------------------------------------------------------------------------
  - kind: ethereum
    name: Aqua
    network: base
    source:
      address: "0x1111113CCf1426A8E30e2bfF5E005d929bF6a90a"
      abi: Aqua
      # The block our Base fork is pinned at. On a real deployment set this to the block the
      # Strikeline router was deployed in; there is nothing to index before it.
      startBlock: 50946000
    context:
      # The app whose strategies we index. Leave as the zero address to index every Strikeline leg
      # on any app. `npm run configure` writes this and the Router address together.
      router:
        type: String
        data: "0x0000000000000000000000000000000000000000"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/aqua.ts
      entities:
        - Maker
        - Leg
        - SurfacePoint
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled

  # ---------------------------------------------------------------------------------------------
  # Our router. `Swapped` is the only event it emits per fill, and its orderHash is the Aqua
  # strategy hash, so a fill joins straight onto the leg it hit.
  # ---------------------------------------------------------------------------------------------
  - kind: ethereum
    name: StrikelineRouter
    network: base
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: StrikelineRouter
      startBlock: 50946000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/router.ts
      entities:
        - Fill
        - Leg
        - Maker
      abis:
        - name: StrikelineRouter
          file: ./abis/StrikelineRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
